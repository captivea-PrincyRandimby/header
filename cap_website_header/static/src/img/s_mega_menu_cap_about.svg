<svg width="82" height="60" viewBox="0 0 82 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Narrow panel: this design is meant for a "Default" sized mega menu -->
  <rect x="24" y="6" width="34" height="48" rx="2" fill="#FFFFFF" stroke="#E7E9EC"/>

  <!-- Two "title + description" entries -->
  <rect x="28" y="11" width="16" height="2" rx="0.5" fill="#C6C5C5"/>
  <rect x="28" y="15" width="12" height="1" rx="0.5" fill="#858585"/>
  <rect x="28" y="19.5" width="16" height="2" rx="0.5" fill="#C6C5C5"/>
  <rect x="28" y="23.5" width="12" height="1" rx="0.5" fill="#858585"/>

  <!-- Separator -->
  <rect x="28" y="28" width="26" height="0.6" fill="#E7E9EC"/>

  <!-- Red section label -->
  <rect x="28" y="31.5" width="11" height="1.6" rx="0.5" fill="#C3222A"/>

  <!-- Offices grid, two columns of "country + pills" -->
  <rect x="28" y="36" width="9" height="1.4" rx="0.5" fill="#858585"/>
  <rect x="28" y="39" width="7" height="2.6" rx="1.3" fill="#FBECEC"/>
  <rect x="36" y="39" width="5" height="2.6" rx="1.3" fill="#FBECEC"/>
  <rect x="43" y="36" width="9" height="1.4" rx="0.5" fill="#858585"/>
  <rect x="43" y="39" width="8" height="2.6" rx="1.3" fill="#FBECEC"/>

  <rect x="28" y="44.5" width="9" height="1.4" rx="0.5" fill="#858585"/>
  <rect x="28" y="47.5" width="8" height="2.6" rx="1.3" fill="#FBECEC"/>
  <rect x="43" y="44.5" width="9" height="1.4" rx="0.5" fill="#858585"/>
  <rect x="43" y="47.5" width="8" height="2.6" rx="1.3" fill="#FBECEC"/>
</svg>
